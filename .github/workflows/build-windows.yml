name: Build Windows Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        run: >-
          dotnet publish .\SeraphyxLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output .\publish

      - name: Package Windows download
        run: Compress-Archive -Path .\publish\SeraphyxLauncher.exe -DestinationPath .\publish\SeraphyxLauncher-windows-x64.zip -Force

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeraphyxLauncher-windows-x64
          path: |
            .\publish\SeraphyxLauncher.exe
            .\publish\SeraphyxLauncher-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: SeraphyxLauncher-windows-x64
          path: release-files

      - name: Publish official 1.0 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Seraphyx Launcher 1.0
          make_latest: true
          body: |
            The first official Seraphyx Launcher release.

            This Windows x64 build includes the custom Seraphyx application icon, selectable Minecraft versions, Vanilla/Fabric/Quilt profiles, a performance preset panel, and Modrinth browsing for mods, modpacks, resource packs, and shaders.

            Offline profiles are for single-player only. Connecting to multiplayer servers requires Microsoft sign-in. Forge and NeoForge modpacks are not currently installable.
          files: |
            release-files/SeraphyxLauncher.exe
            release-files/SeraphyxLauncher-windows-x64.zip

